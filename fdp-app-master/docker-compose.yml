services:

  frontend:
    build: ./frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

  backend:
    build: ./backend

    ports:
      - "5000:5000"

    depends_on:
      - db

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fdpdb

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

volumes:
  postgres_data:
