<!DOCTYPE html>
<html>

<head>
    <title>FDP Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>MODERN APPLICATION LIFECYCLE FROM ARCHITECTURE TO DEPLOYMENT</h1>

<div class="form-container">

    <input
        type="text"
        id="uid"
        placeholder="Unique ID">

    <input
        type="text"
        id="name"
        placeholder="Name">

    <input
        type="text"
        id="department"
        placeholder="Department">

    <select id="mode">
        <option>Online</option>
        <option>Offline</option>
        <option>Hybrid</option>
    </select>

    <button onclick="register()">
        Submit
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
